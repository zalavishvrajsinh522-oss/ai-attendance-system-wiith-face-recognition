{% extends "base.html" %}
{% block title %}Classes{% endblock %}
{% block content %}
<h3 class="mb-4">Classes</h3>
<div class="card p-3 mb-4">
  <form method="POST" class="row g-2">
    <div class="col-md-8"><input class="form-control" name="name" placeholder="e.g. BCA-1, Diploma IT-4" required></div>
    <div class="col-md-4"><button class="btn btn-primary w-100"><i class="bi bi-plus-circle"></i> Create Class</button></div>
  </form>
</div>

<div class="card">
  <table class="table mb-0">
    <thead><tr><th>#</th><th>Class Name</th><th class="text-end">Actions</th></tr></thead>
    <tbody>
      {% for c in classes %}
      <tr>
        <td>{{ loop.index }}</td>
        <td>
          <form method="POST" action="{{ url_for('principal.edit_class', class_id=c.id) }}" class="d-flex gap-2">
            <input class="form-control form-control-sm" name="name" value="{{ c.name }}">
            <button class="btn btn-sm btn-outline-primary">Save</button>
          </form>
        </td>
        <td class="text-end">
          <form method="POST" action="{{ url_for('principal.delete_class', class_id=c.id) }}" onsubmit="return confirm('Delete this class?')">
            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> Delete</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="3" class="text-center text-muted py-4">No classes yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
